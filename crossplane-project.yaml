apiVersion: dev.crossplane.io/v1alpha1
kind: Project
metadata:
  name: hello-crossplane-aws
spec:
  dependencies:
  - type: xpkg
    xpkg:
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3
      version: '>=v0.0.0'
  # function-auto-ready is the second pipeline step in the TenantEnvironment
  # Composition. It must be a declared dependency so the CLI resolves, loads,
  # and registers it for `composition render` / `project run`; otherwise the
  # render engine reports it as an unknown function.
  - type: xpkg
    xpkg:
      apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: '>=v0.0.0'
  repository: ghcr.io/hoangviet1vu/hello-crossplane-aws
