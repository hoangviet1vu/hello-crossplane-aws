# The only workflow for this repo. See .kiro/steering/tech.md#ci-and-versioning
# for the fixed versioning and registry rules.
#
#   Trigger         Registry                                          Version
#   ------------------------------------------------------------------------------
#   pull_request    — (nothing pushed)                                —
#   push to main    ghcr.io/hoangviet1vu/hello-crossplane-aws-dev     v0.0.0-<short-sha>
#   tag v*          ghcr.io/hoangviet1vu/hello-crossplane-aws         <tag>   (not wired yet)
name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

# GHCR login uses the built-in token; project push reuses Docker credentials.
permissions:
  contents: read
  packages: write

env:
  # Pin the CLI — the project workflow is [BETA] and an unpinned install can
  # change under CI. Bump deliberately.
  XP_VERSION: v2.5.0
  # Default (release) repo, used by the tag flow later. The main-merge job
  # overrides this with the -dev repo.
  RELEASE_REPO: ghcr.io/hoangviet1vu/hello-crossplane-aws
  DEV_REPO: ghcr.io/hoangviet1vu/hello-crossplane-aws-dev
  FUNCTION_DIR: functions/compose-tenant-environment

jobs:
  # Runs on every PR and every push to main. Never pushes a package.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.FUNCTION_DIR }}/go.mod

      - name: Install Crossplane CLI
        run: |
          # R7.3: refuse to install with an unpinned CLI.
          [ -n "${XP_VERSION}" ] || { echo "XP_VERSION is unset/empty"; exit 1; }
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/
          crossplane version --client
          # R7.4: confirm install.sh honoured the pin and did not fall back.
          crossplane version --client | grep -qx "Client Version: ${XP_VERSION}" || {
            echo "CLI version mismatch: expected ${XP_VERSION}"; exit 1;
          }

      # Cache the generated dependency models / package cache, keyed on the
      # project file so a dependency change busts it.
      - name: Cache Crossplane dependencies
        uses: actions/cache@v4
        with:
          path: ~/.crossplane/cache
          key: crossplane-cache-${{ hashFiles('crossplane-project.yaml') }}
          restore-keys: |
            crossplane-cache-

      # go vet/go test need the generated dev.crossplane.io/models module
      # under schemas/go (gitignored, referenced via a go.mod replace
      # directive), so this must run before the Go checks.
      - name: Update dependency cache
        run: crossplane dependency update-cache

      - name: gofmt
        working-directory: ${{ env.FUNCTION_DIR }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt -s formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ env.FUNCTION_DIR }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ env.FUNCTION_DIR }}
        run: go test ./...

      # render discovers and builds the embedded function itself (Docker is
      # available on ubuntu-latest), so no functions file argument is needed.
      #
      # `crossplane composition render` defaults --timeout=1m for the whole
      # render, including the cold `go build` of the embedded function. That
      # build's cache key differs from go vet/go test's (different
      # ldflags/CGO settings), so it doesn't reuse their build cache and can
      # legitimately take longer than a minute on a shared CI CPU — the CLI
      # then kills the build subprocess on timeout, which surfaces as
      # "go build: signal: killed" and looks like an OOM but isn't one.
      # Give it real headroom instead.
      - name: Render every example
        run: |
          # R3.6: a zero-match Example_Set must fail the gate, not pass silently.
          # nullglob makes the glob expand to nothing (not a literal) when empty;
          # collecting into an array lets us count before iterating.
          shopt -s nullglob
          examples=(examples/tenantenvironments/*.yaml)
          [ ${#examples[@]} -gt 0 ] || { echo "Example_Set is empty"; exit 1; }
          for example in "${examples[@]}"; do
            echo "::group::render ${example}"
            crossplane composition render \
              --timeout=10m \
              "${example}" \
              apis/tenantenvironments/composition.yaml
            echo "::endgroup::"
          done

  # Main-merge publish path. Builds and pushes the Configuration + embedded
  # function packages to the -dev registry with a v0.0.0-<short-sha> tag.
  publish-dev:
    name: publish (dev snapshot)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.FUNCTION_DIR }}/go.mod

      - name: Install Crossplane CLI
        run: |
          # R7.3: refuse to install with an unpinned CLI.
          [ -n "${XP_VERSION}" ] || { echo "XP_VERSION is unset/empty"; exit 1; }
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/
          crossplane version --client
          # R7.4: confirm install.sh honoured the pin and did not fall back.
          crossplane version --client | grep -qx "Client Version: ${XP_VERSION}" || {
            echo "CLI version mismatch: expected ${XP_VERSION}"; exit 1;
          }

      # v0.0.0-<short-sha>: a valid semver prerelease that carries the commit
      # hash and sorts below every real release, so a main build never wins a
      # version-constraint resolution against a tagged one.
      - name: Compute snapshot version
        id: version
        run: echo "tag=v0.0.0-$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache the generated dependency models / package cache, keyed on the
      # project file so a dependency change busts it.
      - name: Cache Crossplane dependencies
        uses: actions/cache@v4
        with:
          path: ~/.crossplane/cache
          key: crossplane-cache-${{ hashFiles('crossplane-project.yaml') }}
          restore-keys: |
            crossplane-cache-

      - name: Update dependency cache
        run: crossplane dependency update-cache

      # --repository is passed explicitly to BOTH build and push. The target
      # registry is trigger-dependent, so we can't lean on spec.repository.
      # It also determines how embedded functions are referenced in the
      # Composition, so build and push MUST match.
      - name: Build package
        run: crossplane project build --repository="${DEV_REPO}"

      - name: Push package
        run: |
          crossplane project push \
            --repository="${DEV_REPO}" \
            --tag="${{ steps.version.outputs.tag }}"

  # Tag-release publish path. Builds and pushes the Configuration + embedded
  # function packages to the release registry with the pushed Git tag as the
  # version. Gated on v* tag pushes only, so it never runs on PRs, main pushes,
  # non-v tags, or other events — mutually exclusive with publish-dev.
  publish-release:
    name: publish (release)
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.FUNCTION_DIR }}/go.mod

      - name: Install Crossplane CLI
        run: |
          # R7.3: refuse to install with an unpinned CLI.
          [ -n "${XP_VERSION}" ] || { echo "XP_VERSION is unset/empty"; exit 1; }
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/
          crossplane version --client
          # R7.4: confirm install.sh honoured the pin and did not fall back.
          crossplane version --client | grep -qx "Client Version: ${XP_VERSION}" || {
            echo "CLI version mismatch: expected ${XP_VERSION}"; exit 1;
          }
      # R5: the published Package version is the pushed Git tag name, used
      # verbatim (no transform/truncate/prefix-strip). Validate it BEFORE
      # login/build/push so an invalid tag leaves the Release_Registry
      # unchanged. The tag carries a `v` prefix (matched by the trigger) and
      # must be a full semantic version: MAJOR.MINOR.PATCH with optional
      # `-prerelease` and `+build` suffixes. This rejects a bare SHA, `latest`,
      # and incomplete versions like `v1`/`v1.2` (R5.2, R5.3, R5.4).
      - name: Validate release version
        id: version
        run: |
          ref_name="${{ github.ref_name }}"
          # R5.4: empty/unavailable ref name is a hard failure before push.
          [ -n "${ref_name}" ] || { echo "release version is missing"; exit 1; }
          # R5.2/R5.3: semver with required v prefix. Anchored ERE.
          #   v MAJOR.MINOR.PATCH  [ -prerelease ]  [ +build ]
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "${ref_name}" | grep -Eq "${semver}"; then
            echo "invalid semantic version: ${ref_name}"; exit 1
          fi
          # R5.1: export the validated value unchanged for the push step.
          echo "tag=${ref_name}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache the generated dependency models / package cache, keyed on the
      # project file so a dependency change busts it.
      - name: Cache Crossplane dependencies
        uses: actions/cache@v4
        with:
          path: ~/.crossplane/cache
          key: crossplane-cache-${{ hashFiles('crossplane-project.yaml') }}
          restore-keys: |
            crossplane-cache-

      - name: Update dependency cache
        run: crossplane dependency update-cache

      # --repository is passed explicitly to BOTH build and push, pointing at
      # the release registry (unlike publish-dev, which targets DEV_REPO). The
      # target registry is trigger-dependent, so we can't lean on
      # spec.repository. It also determines how embedded functions are
      # referenced in the Composition, so build and push MUST match. A build
      # failure fails the run before push, leaving the Release_Registry
      # unchanged.
      - name: Build package
        run: crossplane project build --repository="${RELEASE_REPO}"

      # A single `project push` ships the Configuration and embedded function
      # package(s) together. --repository reuses the same RELEASE_REPO
      # reference as build, so the two are byte-for-byte identical (R6.2,
      # R6.3), and targets only the release registry, never DEV_REPO (R4.1,
      # R4.3, R11.4). --tag is the validated Git tag from the version step.
      # Runs only after a successful build; a push failure fails the run and
      # surfaces the error (R3.1, R3.4).
      - name: Push package
        run: |
          crossplane project push \
            --repository="${RELEASE_REPO}" \
            --tag="${{ steps.version.outputs.tag }}"
